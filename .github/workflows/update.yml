name: update-prices
on:
  schedule: [{cron: "5 23,2,5,8,11 * * *"}]   # UTC -> 06:05, 09:05, 12:05, 15:05, 18:05 Asia/Saigon
  workflow_dispatch:
  push: {branches: [main], paths-ignore: ["data/history/**", "data/registry/**", "data/views/**", "trends/data/feed.json", "trends/data/legal-feed.json"]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch prices (failed sources keep last good value, flagged stale)
        run: python fetcher.py | tee fetch.log
      - name: Validate canonical history CSV
        run: python store.py check
      - run: python export_static.py
      - name: Build forecasts (Dự báo) – non-blocking
        continue-on-error: true
        run: python forecast/build.py --site site 2>&1 | grep -v Warning | tail -20
      - name: Contract price-adjustment monitor (Điều chỉnh giá HĐ) – non-blocking
        continue-on-error: true
        run: python dieu_chinh/build.py --site site
      - name: Pull free news feeds (RSS/Google News) – non-blocking
        continue-on-error: true
        run: python trends/feeds.py
      - name: Hợp đồng & Pháp lý – quét tin mới (chưa kiểm chứng) – non-blocking
        continue-on-error: true
        run: python trends/legal_feed.py
      - name: Build hub pages (Trang chủ, Danh mục, Xu hướng, Thị trường) + shared nav
        run: python trends/build.py
      - name: SCM landed cost TQ vs nội địa – refresh FX, recompute (non-blocking)
        continue-on-error: true
        run: python trends/landed.py --site site
      - name: Daily page views (GoatCounter API, Vietnam days) – non-blocking
        continue-on-error: true
        env: {GOATCOUNTER_TOKEN: "${{ secrets.GOATCOUNTER_TOKEN }}"}
        run: python trends/views.py
      - name: Commit price history
        continue-on-error: true
        run: |
          git config user.name "price-bot" && git config user.email "price-bot@users.noreply.github.com"
          git add data/history data/registry data/views trends/data/feed.json trends/data/legal-feed.json
          git commit -m "prices $(TZ=Asia/Ho_Chi_Minh date +%F' '%H:%M) [skip ci]" || exit 0
          git push || (git fetch origin main && git rebase -X theirs origin/main && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
