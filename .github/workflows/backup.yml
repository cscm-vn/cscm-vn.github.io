name: monthly-backup
on:
  schedule: [{cron: "30 0 1 * *"}]   # 07:30 Asia/Saigon on the 1st of each month
  workflow_dispatch:
    inputs: {tag: {description: "Release tag (default backup-YYYY-MM)", required: false}}
permissions: {contents: write}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate + rebuild SQLite from CSV
        run: |
          python store.py check
          python store.py build --db prices.db
          python -c "import sqlite3;c=sqlite3.connect('prices.db');print({t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in ('items','obs','runs')})" | tee counts.txt
      - name: Package
        run: |
          TAG="${{ inputs.tag }}"; TAG="${TAG:-backup-$(TZ=Asia/Ho_Chi_Minh date +%Y-%m)}"; echo "TAG=$TAG" >> $GITHUB_ENV
          zip -qr "gia-vat-tu-$TAG.zip" data/history data/registry data/taxonomy.json DATA.md store.py
          gzip -9c prices.db > "prices-$TAG.db.gz"
          sha256sum *.zip *.gz > SHA256SUMS.txt; ls -la *.zip *.gz
      - name: Publish release (replaces assets if tag exists)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          NOTES="Sao lưu đầy đủ lịch sử giá ($(TZ=Asia/Ho_Chi_Minh date '+%F %H:%M') ICT). Số dòng: $(cat counts.txt). Khôi phục: unzip, rồi python store.py build."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip *.gz SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" *.zip *.gz SHA256SUMS.txt --title "Backup $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
