name: probe-sources
on:
  workflow_dispatch:
    inputs:
      mode: {description: "all | sxd | web | rows", default: "all"}
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python tools/probe_sources.py ${{ github.event.inputs.mode }}
