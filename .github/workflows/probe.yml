name: probe-hcm-sources
on:
  push: {branches: ["probe/**"], paths: ["probe/*.py", ".github/workflows/probe.yml"]}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install curl_cffi beautifulsoup4
      - run: python probe/discover.py
      - name: Save downloaded files to the probe branch for inspection
        run: |
          git config user.name "price-bot" && git config user.email "price-bot@users.noreply.github.com"
          git add probe/files && git commit -m "probe: downloaded notices [skip ci]" && git push || echo "nothing to push"
