<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diễn biến tháng/năm – Masterise Procurement Hub</title><link rel="stylesheet" href="hub.css"><script src="hub-common.js"></script></head>
<body class="hub" data-page="thang"><div id="hubnav"></div>
<main class="wrap"><div class="crumb" id="crumb"></div>
 <h1>Diễn biến theo tháng & năm</h1><p class="sub">Bản tin tháng: biến động giá theo danh mục (MoM/YoY), xu hướng & tin nổi bật trong tháng. Dùng cho họp giao ban tháng / báo cáo quý.</p>
 <div class="filters"><select id="mo"></select><span class="seg" id="per"><button data-p="mom" class="on">Theo tháng (MoM)</button><button data-p="yoy">Theo năm (YoY)</button></span></div>
 <h2>📊 Biến động giá theo danh mục</h2><div class="tw" style="max-height:none"><table class="t" id="cat"></table></div>
 <p class="small mute" id="note"></p>
 <div class="grid g2"><section><h2>💡 Xu hướng nổi bật trong tháng</h2><div id="tt" class="grid"></div></section><section><h2>📰 Tin thị trường trong tháng</h2><ul class="news card" id="hh"></ul></section></div>
 <div class="foot" id="foot"></div></main>
<script>
(async () => {
 const [h, t] = await Promise.all([HUB.get("hub.json"), HUB.tax()]); const E = HUB.esc; HUB.crumb(["<b>Diễn biến tháng/năm</b>"]);
 const D = h.digest; document.getElementById("mo").innerHTML = D.map(d => `<option value="${d.month}">Tháng ${d.month.split("-").reverse().join("/")} (${d.n_trends} xu hướng, ${d.n_market} tin)</option>`).join("");
 let per = "mom";
 const drawCat = () => { const rows = []; for (const n of t.tree) for (const c of n.children) { const L = h.items.filter(x => x.tax === c.id && x[per] != null); if (!L.length) continue;
   const avg = L.reduce((s, x) => s + x[per], 0) / L.length; const top = L.slice().sort((a, b) => Math.abs(b[per]) - Math.abs(a[per]))[0]; rows.push({n, c, L, avg, top}); }
  document.getElementById("cat").innerHTML = `<tr><th>Nhóm</th><th>Danh mục</th><th class="n">Số mã</th><th class="n">TB ${per.toUpperCase()}</th><th>Biến động mạnh nhất</th></tr>` + (rows.map(r => `<tr><td>${r.n.icon} ${E(r.n.name)}</td><td>${HUB.catLink(r.c.id, r.c.name)}</td><td class="n">${r.L.length}</td><td class="n">${HUB.pct(r.avg)}</td>
    <td><a href="mat-hang.html?id=${r.top.id}">${E(r.top.name)}</a> ${HUB.pct(r.top[per])}</td></tr>`).join("") || `<tr><td colspan=5 class="mute">Chưa đủ lịch sử để tính ${per.toUpperCase()}.</td></tr>`);
  const have = h.items.filter(x => x[per] != null).length;
  document.getElementById("note").textContent = `${have}/${h.items.length} mã đủ lịch sử để tính ${per === "mom" ? "MoM (~30 ngày)" : "YoY (~365 ngày)"}. Kim loại thế giới (LME, COMEX) có lịch sử ~3 tháng; giá VN (thép theo hãng, Sở XD) tích lũy từ 21/10/2026 → MoM đầy đủ từ cuối 11/2026, YoY từ 10/2027.`; };
 const drawMo = () => { const d = D.find(x => x.month === document.getElementById("mo").value) || D[0]; if (!d) return;
  document.getElementById("tt").innerHTML = d.top_trends.map(x => `<div class="card"><span class="score">${Math.round(x.score)}</span> <a href="xu-huong.html?id=${x.id}"><b>${E(x.title)}</b></a> <span class="pill cat">${E(x.category)}</span></div>`).join("") || '<div class="empty">Không có.</div>';
  document.getElementById("hh").innerHTML = d.headlines.map(x => `<li><a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.title)}</a> <span class="pill">${E(x.region || "")}</span></li>`).join("") || "<li class=mute>Không có.</li>"; };
 document.querySelectorAll("#per button").forEach(b => b.onclick = () => { per = b.dataset.p; document.querySelectorAll("#per button").forEach(z => z.classList.toggle("on", z === b)); drawCat(); });
 document.getElementById("mo").oninput = drawMo; drawCat(); drawMo(); HUB.foot();
})();
</script></body></html>
